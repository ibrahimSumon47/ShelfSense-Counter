name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: nothing in CI is allowed to write back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Commit authors, messages and branches
        run: node scripts/check-history.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tracked files (secrets, data, weights, names)
        run: node scripts/check-repo-files.mjs
      - name: Secret scan over full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .

  repo-scripts:
    name: Repo scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests for hooks, checks and web TypeScript modules
        run: |
          node --test "scripts/test/*.test.mjs"
          node --experimental-strip-types --test "apps/web/src/lib/shelfsense.test.ts"
      - name: features.json is well formed
        run: node scripts/check-done.mjs --validate

  training-tests:
    name: Training data pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Sync training and python packages and run pytest
        run: |
          uv sync --directory training --extra dev
          uv run --directory training pytest -v
          uv sync --directory python --extra dev
          uv run --directory python pytest -v

  count-regression:
    name: Count regression on 20 fixed images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # The bundle holds 20 test-split photos and the counts the published model produced,
      # so a broken decoder or a swapped model fails CI instead of moving a README number.
      - name: Is the fixture bundle published yet?
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "No v1.0.0 release yet, so the count regression has nothing to run against."
          fi
      - name: Download the bundle and the model
        if: steps.bundle.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p training/fixtures
          gh release download v1.0.0 --repo "${{ github.repository }}" --pattern 'shelfsense-regression-v1.tar.gz' --dir training/fixtures --clobber
          gh release download v1.0.0 --repo "${{ github.repository }}" --pattern '*-int8.onnx' --dir training/fixtures --clobber
          mkdir -p training/fixtures/shelfsense-regression-v1
          tar -xzf training/fixtures/shelfsense-regression-v1.tar.gz -C training/fixtures/shelfsense-regression-v1
          mv training/fixtures/*-int8.onnx training/fixtures/shelfsense-regression-v1/model.onnx
      - name: Run the count regression
        if: steps.bundle.outputs.ready == '1'
        run: |
          uv sync --directory training --extra train --extra dev
          uv run --directory training pytest tests/test_regression_counts.py -v

  onnx-export:
    name: ONNX export on CPU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # An export bug costs a whole Kaggle GPU slot, so the real wrapper is built and run
      # here at 128 px on randomly initialised weights before any kernel is pushed.
      - name: Build a tiny FCOS and export it to ONNX
        run: |
          uv venv --directory training --python 3.12 .venv-ci
          # The CPU wheel index only carries torch, so the other packages come from PyPI first.
          uv pip install --python training/.venv-ci/bin/python numpy pillow onnx onnxruntime pytest
          uv pip install --python training/.venv-ci/bin/python torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          training/.venv-ci/bin/python -m pytest training/tests/test_onnx_export_cpu.py -v

  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


