[project]
name = "shelfsense"
version = "0.1.0"
description = "Retail shelf product counter, empty-gap detector, CLI, and FastAPI batch service."
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.3.0",
  "numpy>=1.26.0",
  "onnxruntime>=1.18.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[project.scripts]
shelfsense = "shelfsense.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsense"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
