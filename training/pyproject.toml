[project]
name = "shelfsense-training"
version = "0.1.0"
description = "Dataset preparation, leak-free splitting, and Kaggle training utilities for ShelfSense."
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.3.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]
train = [
  "numpy>=1.26.0",
  "onnx>=1.16.0",
  "onnxruntime>=1.18.0",
  # coco_eval.py scores with pycocotools; without it the count regression cannot run at all.
  "pycocotools>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelfsense_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
